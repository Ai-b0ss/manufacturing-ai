name: Basic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Python AST syntax check
        run: |
          python -c "import ast, pathlib; files=[f for f in pathlib.Path('.').rglob('*.py') if '.git' not in f.parts]; [ast.parse(f.read_text('utf-8-sig'), str(f)) for f in files]; print(f'AST OK: {len(files)} files')"
      - name: Synthetic HTTP, access and revision tests
        run: python -m unittest test_app test_engineering_retrieval test_engineering_evidence test_quality_grounding test_storage_index_worker
      - name: Frontend JS syntax and state-machine regressions
        run: |
          node --check app.js
          node tests_pg/test_storage_ui_polling.cjs
          node tests_pg/test_storage_ui_selection.cjs
